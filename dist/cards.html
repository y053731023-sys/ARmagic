<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>列印辨識卡｜紙上逃跑</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:32px;color:#17201b;background:#eef1e9}main{max-width:780px;margin:auto}h1{font-weight:500}p{line-height:1.8}button,a{font:inherit;background:#17201b;color:white;border:0;border-radius:30px;padding:12px 24px;text-decoration:none;cursor:pointer}.cards{display:flex;flex-wrap:wrap;gap:20mm;margin:36px 0}.card{background:white;width:63mm;height:88mm;border:1px dashed #888;display:flex;align-items:center;justify-content:center;flex-direction:column}.card img{width:53mm;height:73.15mm;object-fit:contain}.card small{font-size:10px;letter-spacing:2px;margin:8px 0}.card strong{font-size:13px;font-weight:500}footer{font-size:13px;color:#576256}@page{size:A4;margin:20mm}@media print{body{background:#fff;margin:0}.controls,.intro,footer{display:none}.cards{gap:20mm;margin:0}.card{break-inside:avoid;print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><main><div class="intro"><h1>你的魔術卡</h1><p>使用 A4 紙，以 <b>100% 原始比例</b>列印，關閉頁首頁尾。剪下後約為撲克牌大小（63 × 88 mm）。<br>保留完整牌背圖案與白邊；可以貼在卡片背面。卡片放在牌堆最上方。</p></div><div class="controls"><button onclick="window.print()">列印卡片</button> <a href="index.html">回到相機</a></div><div class="cards"><section class="card"><small>POCKET MAGIC / 01</small><img src="assets/blue-card.jpg" alt="藍色牌背"><strong>藏身處 · 放在牌堆上</strong></section></div><footer>使用你提供的藍色牌背。對準完整牌背即可播放；長按右下角雙箭頭一秒可重置。<br>也可以先在另一個螢幕顯示卡片測試，請留意螢幕反光。</footer></main></body></html>
