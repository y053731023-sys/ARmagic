<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>相機｜紙上逃跑</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7'/%3E%3Ccircle cx='16' cy='16' r='10' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=camera-1"></head><body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg"><defs><symbol id="rotate" viewBox="0 0 32 32"><path d="M5 13a11 11 0 0 1 20-4l3 5M27 19A11 11 0 0 1 7 24l-3-5M22 14h6V8M10 19H4v6"/></symbol><symbol id="flash" viewBox="0 0 32 32"><path d="m18 2-13 17h10l-1 11 13-18H17zM3 3l26 26"/></symbol><symbol id="live" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" stroke-dasharray="1 3"/><circle cx="16" cy="16" r="8"/><circle cx="16" cy="16" r="3"/><path d="m3 3 26 26"/></symbol></defs></svg>
<main id="camera-viewport" aria-label="相機取景畫面"><div id="stage"></div><div id="viewfinder" class="grid" aria-hidden="true"></div>
<div class="camera-settings" aria-label="相機狀態"><span aria-label="閃光燈關閉"><svg><use href="#flash"/></svg></span><span aria-label="原況照片關閉"><svg><use href="#live"/></svg></span><span class="ev">0.0<small>EV</small></span><span class="night" aria-label="夜間模式自動">☾<sup>A</sup></span></div>
<div class="zoom" aria-label="數位縮放"><button disabled aria-label="此網頁不提供超廣角">.5</button><button class="selected" data-zoom="1" aria-pressed="true">1×</button><button data-zoom="2" aria-pressed="false">2</button><button data-zoom="4" aria-pressed="false">4</button><button data-zoom="8" aria-pressed="false">8</button></div>
<div class="capture-controls"><button id="help" class="round function" aria-label="操作說明">ƒ</button><button id="shutter" aria-label="拍照"><span></span></button><button id="grid-toggle" class="round dots" aria-label="切換九宮格" aria-pressed="true">⠿</button></div></main>
<section id="intro" hidden><h1>相機</h1><p>允許使用相機，開始你的表演。</p><button id="start" class="primary">開啟相機</button><button id="demo" class="text-button">動畫預演</button></section>
<div id="status" role="status" aria-live="polite" hidden></div><div id="toast" role="status" hidden></div>
<div class="playback-actions"><button id="resume" hidden>繼續動畫</button><button id="retry" hidden onclick="location.reload()">重新開啟</button><button id="camera-switch" hidden onclick="location.reload()">開啟相機</button></div>
<footer><button id="cards" class="thumbnail" aria-label="卡片與說明"><img src="assets/blue-card.jpg" alt="藍色牌背"></button><div class="modes" aria-label="拍照模式"><span>錄影</span><span class="selected">拍照</span><span>人像</span></div><button id="reset" class="round mirror" aria-label="鏡像；長按一秒重置魔術" aria-pressed="false"><svg><use href="#rotate"/></svg></button></footer>
<div class="sr-only"><span id="mode"></span></div>
<dialog id="guide"><button class="close" aria-label="關閉">×</button><h2>表演準備</h2><ol><li>準備一張藍色牌背，放在牌堆最上方。</li><li>鏡頭對準完整牌背，小人就會跑入、畫門並走進牌裡。</li><li>長按右下角雙箭頭一秒，即可重置並再次演出。</li></ol><p><b>右下角雙箭頭：輕點鏡像，長按一秒重置演出。</b></p><p>倍率為數位縮放；上方圖示與「錄影／人像」文字用於相機外觀，本頁提供拍照。手機實拍前請先彩排。</p><a class="primary" href="cards.html" target="_blank" rel="noopener">開啟可列印牌背</a></dialog>
<dialog id="photo"><button class="photo-close" aria-label="關閉照片">×</button><img id="photo-image" alt="剛拍攝的相片"><a id="save-photo" class="primary" download="magic-photo.png">儲存照片</a><p>iPhone 也可長按照片儲存。</p></dialog>
<script type="module" src="app.js?v=autocamera-1"></script></body></html>
